<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuito Terê Verde Online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>🌿 Circuito Terê Verde Online</h1>
    <nav>
      <a href="#trilhas">Trilhas</a>
      <a href="#eventos">Eventos</a>
      <a href="#novidades">Novidades</a>
      <a href="#login">Admin</a>
    </nav>
  </header>

  <section id="trilhas">
    <h2>🥾 Trilhas</h2>
    <div id="lista-trilhas">Carregando...</div>
  </section>

  <section id="eventos">
    <h2>📅 Eventos</h2>
    <div id="lista-eventos">Carregando...</div>
  </section>

  <section id="novidades">
    <h2>📰 Novidades</h2>
    <div id="lista-novidades">Carregando...</div>
  </section>

  <section id="login">
    <h2>🔑 Login de Administradores</h2>
    <div id="form-login">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="senha" placeholder="Senha" />
      <button onclick="fazerLogin()">Entrar</button>
      <p id="msg-login"></p>
    </div>
    <div id="painel-admin" style="display:none">
      <h3>✅ Painel do Administrador</h3>
      <button onclick="logout()">Sair</button>
      <h4>➕ Nova Trilha</h4>
      <input type="text" id="trilha-nome" placeholder="Nome da trilha" />
      <input type="text" id="trilha-descricao" placeholder="Descrição" />
      <input type="text" id="trilha-dificuldade" placeholder="Dificuldade" />
      <button onclick="criarTrilha()">Salvar Trilha</button>
      <h4>➕ Novo Evento</h4>
      <input type="text" id="evento-titulo" placeholder="Título do evento" />
      <input type="text" id="evento-descricao" placeholder="Descrição" />
      <input type="date" id="evento-inicio" />
      <input type="date" id="evento-fim" />
      <input type="text" id="evento-horario" placeholder="Horário (ex: 09:00)" />
      <button onclick="criarEvento()">Salvar Evento</button>
      <h4>➕ Nova Novidade</h4>
      <input type="text" id="novidade-titulo" placeholder="Título" />
      <textarea id="novidade-conteudo" placeholder="Conteúdo"></textarea>
      <button onclick="criarNovidade()">Salvar Novidade</button>
    </div>
  </section>

    <h3>⚙️ Criar Administ
